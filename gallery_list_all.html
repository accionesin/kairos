<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>📂 Acciones.in – Galerías registradas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 40px;
    }

    h1 {
      color: #38bdf8;
    }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    ul {
      margin-top: 15px;
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    .ok {
      color: #22c55e;
      font-weight: bold;
    }

    .warn {
      color: #facc15;
      font-weight: bold;
    }

    .error {
      color: #ef4444;
      font-weight: bold;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.85em;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <h1>📂 Acciones.in – Galerías registradas</h1>

  <div class="card">
    <p>Este módulo consulta todas las galerías existentes en Kairos.</p>

    <button onclick="loadGalleries()">🔄 Cargar galerías</button>

    <div id="result" class="card" style="display:none;"></div>

    <div class="hint">
      Las galerías se crean automáticamente al hacer enroll.<br>
      Ejemplo esperable: <b>acciones.in</b>
    </div>
  </div>

  <script>
    async function loadGalleries() {
      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = "⏳ Consultando galerías...";

      try {
        const response = await fetch(
          "https://kairos.clubempx.workers.dev/gallery_list_all",
          { method: "POST" }
        );

        const data = await response.json();

        if (!data.gallery_ids || data.gallery_ids.length === 0) {
          resultDiv.innerHTML = `
            <div class="warn">⚠️ No hay galerías registradas</div>
            <p>Registra al menos un rostro usando <b>enroll</b>.</p>
          `;
          return;
        }

        let list = "<ul>";
        data.gallery_ids.forEach(gallery => {
          list += `<li>📁 ${gallery}</li>`;
        });
        list += "</ul>";

        resultDiv.innerHTML = `
          <div class="ok">✅ Galerías encontradas (${data.gallery_ids.length})</div>
          ${list}
        `;

      } catch (err) {
        resultDiv.innerHTML = `
          <div class="error">❌ Error al consultar galerías</div>
        `;
      }
    }
  </script>

</body>
</html>
