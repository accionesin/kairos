<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>🗂️ AiDi – Comunidades Registradas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 40px;
    }

    h1 {
      color: #38bdf8;
    }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    button {
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: none;
    }

    button:hover {
      background: #0ea5e9;
    }

    ul {
      margin-top: 15px;
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    .ok {
      color: #22c55e;
      font-weight: bold;
    }

    .warn {
      color: #facc15;
      font-weight: bold;
    }

    .error {
      color: #f87171;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🗂️ AiDi – Comunidades Registradas</h1>

  <div class="card">
    <button onclick="loadGalleries()">📡 Consultar Comunidades</button>
  </div>

  <div id="result" class="card" style="display:none;"></div>

  <script>
    async function loadGalleries() {
      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = "⏳ Consultando galerías...";

      try {
        const response = await fetch(
          "https://kairos.clubempx.workers.dev/gallery_list_all",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" }
          }
        );

        const data = await response.json();

        if (!data.gallery_ids || data.gallery_ids.length === 0) {
          resultDiv.innerHTML = `
            <div class="warn">⚠️ No hay galerías registradas</div>
            <p>Registra al menos un rostro usando <strong>enroll</strong>.</p>
          `;
          return;
        }

        let html = `<div class="ok">✅ Galerías encontradas:</div><ul>`;

        data.gallery_ids.forEach(name => {
          html += `<li>📁 ${name}</li>`;
        });

        html += "</ul>";
        resultDiv.innerHTML = html;

      } catch (err) {
        resultDiv.innerHTML = `
          <div class="error">❌ Error al consultar galerías</div>
          <p>${err.message}</p>
        `;
      }
    }
  </script>

</body>
</html>
