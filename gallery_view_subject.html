<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>👤 Acciones.in – Detalle de Rostro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      max-width: 520px;
      margin: 20px auto;
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: none;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #020617;
      border: 1px solid #1e293b;
    }

    .ok {
      color: #22c55e;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .error {
      color: #ef4444;
      font-weight: bold;
    }

    .field {
      margin: 6px 0;
    }

    .label {
      opacity: 0.7;
      font-size: 0.9em;
    }

    pre {
      margin-top: 15px;
      background: #020617;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85em;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <h1>👤 Detalle de rostro registrado</h1>

  <div class="card">
    <label>Galería</label>
    <input id="gallery" value="acciones.in" />

    <label>Subject ID</label>
    <input id="subject" placeholder="Ej: oscar_castro_594" />

    <button onclick="consultar()">Consultar rostro</button>

    <div id="resultado"></div>
  </div>

  <script>
    async function consultar() {
      const gallery = document.getElementById("gallery").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const result = document.getElementById("resultado");

      if (!gallery || !subject) {
        result.innerHTML = `<div class="result error">⚠️ Debes ingresar galería y subject_id</div>`;
        return;
      }

      result.innerHTML = `<div class="result">⏳ Consultando información del rostro…</div>`;

      try {
        const res = await fetch("https://kairos.clubempx.workers.dev/gallery_view_subject", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            gallery_name: gallery,
            subject_id: subject
          })
        });

        const data = await res.json();

        if (data.Errors || data.errors) {
          result.innerHTML = `
            <div class="result error">
              ❌ El rostro no existe en esta galería
            </div>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
          return;
        }

        const face = data.face_ids[0];
        const fecha = parseKairosDate(face.enrollment_timestamp);

        result.innerHTML = `
          <div class="result">
            <div class="ok">✅ Rostro registrado correctamente</div>

            <div class="field"><span class="label">Galería:</span> ${gallery}</div>
            <div class="field"><span class="label">Subject ID:</span> ${subject}</div>
            <div class="field"><span class="label">Face ID:</span> ${face.face_id}</div>
            <div class="field"><span class="label">Registrado el:</span> ${fecha}</div>

            <pre>${JSON.stringify(data, null, 2)}</pre>
          </div>
        `;

      } catch (err) {
        result.innerHTML = `
          <div class="result error">
            ❌ Error de conexión con el sistema
          </div>
        `;
      }
    }

    function parseKairosDate(ts) {
      if (!ts || ts.length !== 14) return "—";
      return `${ts.substring(0,4)}-${ts.substring(4,6)}-${ts.substring(6,8)} 
              ${ts.substring(8,10)}:${ts.substring(10,12)}:${ts.substring(12,14)}`;
    }
  </script>

</body>
</html>
