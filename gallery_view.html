<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>📂 Acciones.in – Ver Galería</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 40px;
    }

    h1 {
      color: #38bdf8;
    }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    input, button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    ul {
      margin-top: 15px;
      padding-left: 20px;
    }

    li {
      margin-bottom: 6px;
    }

    .ok { color: #22c55e; font-weight: bold; }
    .warn { color: #facc15; }
    .err { color: #ef4444; }
  </style>
</head>

<body>

<h1>📂 Acciones.in – Ver Galería</h1>

<div class="card">
  <label>Nombre de la galería:</label>
  <input type="text" id="galleryName" value="acciones.in">

  <button onclick="viewGallery()">Consultar galería</button>
</div>

<div id="result" class="card" style="display:none;"></div>

<script>
async function viewGallery() {
  const galleryName = document.getElementById("galleryName").value.trim();
  const result = document.getElementById("result");

  result.style.display = "block";
  result.innerHTML = "⏳ Consultando galería...";

  if (!galleryName) {
    result.innerHTML = "<div class='warn'>⚠️ Debes ingresar el nombre de la galería.</div>";
    return;
  }

  try {
    const res = await fetch("https://kairos.clubempx.workers.dev/gallery_view", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gallery_name: galleryName })
    });

    const data = await res.json();

    if (data.Errors) {
      result.innerHTML = "<div class='err'>❌ Error al consultar la galería.</div>";
      return;
    }

    const subjects = data.subject_ids || [];

    if (subjects.length === 0) {
      result.innerHTML = `
        <div class="warn">⚠️ La galería está vacía.</div>
        <p>No hay rostros registrados aún.</p>
      `;
      return;
    }

    let list = subjects.map(s => `<li>👤 ${s}</li>`).join("");

    result.innerHTML = `
      <div class="ok">✅ Galería encontrada</div>
      <p><strong>Galería:</strong> ${galleryName}</p>
      <p><strong>Rostros registrados:</strong></p>
      <ul>${list}</ul>
    `;

  } catch (err) {
    result.innerHTML = "<div class='err'>❌ Error al contactar el sistema.</div>";
  }
}
</script>

</body>
</html>
