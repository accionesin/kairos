<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>🔍 AiDi – Análisis para Identidad Digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 40px;
    }

    h1 { color: #38bdf8; }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    input, button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #0ea5e9; }

    .ok { color: #22c55e; font-weight: bold; }

    .section { margin-top: 15px; }

    .section-title {
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .warning {
      font-size: 0.85em;
      opacity: 0.7;
    }

    img, video {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>

<h1>🔍 AiDi – Análisis para Identidad Digital</h1>

<div class="card">

  <!-- =============================
       OPCIÓN 1: ARCHIVO
  ============================== -->
  <label>📎 Adjuntar imagen:</label>
  <input type="file" id="imageFile" accept="image/*" onchange="previewFile()" />

  <!-- =============================
       OPCIÓN 2: URL
  ============================== -->
  <label>🔗 O URL pública de imagen:</label>
  <input type="text" id="imageUrl" placeholder="https://..." onblur="previewUrl()" />
  <div class="warning">La URL debe ser pública y accesible</div>

  <!-- =============================
       OPCIÓN 3: CÁMARA
  ============================== -->
  <label>📸 O usar cámara del dispositivo:</label>
  <button onclick="startCamera()">Usar cámara</button>
  <video id="camera" autoplay playsinline style="display:none;"></video>
  <button onclick="capturePhoto()" id="captureBtn" style="display:none;">📷 Tomar foto</button>

  <canvas id="canvas" style="display:none;"></canvas>

  <img id="preview" style="display:none;" />

  <button onclick="analyzeFace()">Analizar rostro</button>
</div>

<div id="result" class="card" style="display:none;"></div>

<script>
  let currentImagePreview = "";
  let cameraStream = null;

  // =============================
  // PREVIEW ARCHIVO
  // =============================
  function previewFile() {
    const file = document.getElementById("imageFile").files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      currentImagePreview = reader.result;
      showPreview(reader.result);
    };
    reader.readAsDataURL(file);
  }

  // =============================
  // PREVIEW URL
  // =============================
  function previewUrl() {
    const url = document.getElementById("imageUrl").value.trim();
    if (!url) return;
    currentImagePreview = url;
    showPreview(url);
  }

  function showPreview(src) {
    const img = document.getElementById("preview");
    img.src = src;
    img.style.display = "block";
  }

  // =============================
  // CÁMARA
  // =============================
  async function startCamera() {
    const video = document.getElementById("camera");
    const captureBtn = document.getElementById("captureBtn");

    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }
      });
      video.srcObject = cameraStream;
      video.style.display = "block";
      captureBtn.style.display = "block";
    } catch (err) {
      alert("No se pudo acceder a la cámara.");
    }
  }

  function capturePhoto() {
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const img = document.getElementById("preview");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    const dataUrl = canvas.toDataURL("image/jpeg");
    currentImagePreview = dataUrl;
    img.src = dataUrl;
    img.style.display = "block";

    // apagar cámara
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
    }

    video.style.display = "none";
    document.getElementById("captureBtn").style.display = "none";
  }

  // =============================
  // ANALYZE
  // =============================
  async function analyzeFace() {
    const fileInput = document.getElementById("imageFile");
    const urlInput = document.getElementById("imageUrl").value.trim();
    const resultDiv = document.getElementById("result");

    resultDiv.style.display = "block";
    resultDiv.innerHTML = "⏳ Analizando imagen...";

    let payload;

    if (currentImagePreview.startsWith("data:image")) {
      payload = { image: currentImagePreview.split(",")[1] };
    } else if (fileInput.files.length > 0) {
      const base64 = await toBase64(fileInput.files[0]);
      payload = { image: base64 };
    } else if (urlInput) {
      payload = { image: urlInput };
    } else {
      resultDiv.innerHTML = "⚠️ Debes adjuntar imagen, URL o usar la cámara.";
      return;
    }

    try {
      const response = await fetch("https://kairos.clubempx.workers.dev/detect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      renderResult(data);
    } catch (err) {
      resultDiv.innerHTML = "❌ Error al procesar la imagen.";
    }
  }

  // =============================
  // RENDER
  // =============================
  function renderResult(data) {
    const resultDiv = document.getElementById("result");

    if (!data.images || !data.images[0].faces.length) {
      resultDiv.innerHTML = "❌ No se detectó ningún rostro.";
      return;
    }

    const face = data.images[0].faces[0];
    const attr = face.attributes;

    resultDiv.innerHTML = `
      <div class="ok">✅ Rostro detectado correctamente</div>
      <img src="${currentImagePreview}" />

      <div class="section">
        <div class="section-title">Percepción general</div>
        Edad estimada: ${attr.age} años<br>
        Género: ${attr.gender.type === "M" ? "Masculino" : "Femenino"}
      </div>

      <div class="section">
        <div class="section-title">Orientación</div>
        Horizontal: ${face.yaw}°<br>
        Vertical: ${face.pitch}°
      </div>

      <div class="section">
        <div class="section-title">Calidad</div>
        Confianza: ${(face.confidence * 100).toFixed(2)} %
      </div>
    `;
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }
</script>

</body>
</html>
