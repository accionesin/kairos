<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>👤 Acciones.in – Ver Rostro Registrado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
    }

    h1 {
      color: #222;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    pre {
      background: #f0f0f0;
      padding: 10px;
      margin-top: 20px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>👤 Ver rostro registrado</h1>

    <label for="gallery">Galería</label>
    <input id="gallery" value="acciones.in" />

    <label for="subject">Subject ID</label>
    <input id="subject" placeholder="Ej: LeonardoDelgado_905" />

    <button onclick="consultar()">Consultar rostro</button>

    <pre id="resultado"></pre>
  </div>

  <script>
    async function consultar() {
      const gallery = document.getElementById("gallery").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const output = document.getElementById("resultado");

      output.textContent = "⏳ Consultando…";

      if (!gallery || !subject) {
        output.innerHTML = "⚠️ Debes ingresar galería y subject_id";
        return;
      }

      try {
        const res = await fetch("https://kairos.clubempx.workers.dev/gallery_view_subject", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            gallery_name: gallery,
            subject_id: subject
          })
        });

        const data = await res.json();

        if (data.Errors || data.errors) {
          output.innerHTML = `<span class="error">❌ Rostro no encontrado</span>\n\n${JSON.stringify(data, null, 2)}`;
        } else {
          output.innerHTML = `<span class="ok">✅ Rostro encontrado</span>\n\n${JSON.stringify(data, null, 2)}`;
        }

      } catch (err) {
        output.innerHTML = `<span class="error">❌ Error de conexión</span>\n${err.message}`;
      }
    }
  </script>

</body>
</html>
