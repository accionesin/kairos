<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>👤✅ AiDi – Verificación de Identidad Digital</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 40px;
    }

    h1 { color: #38bdf8; }

    .card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    input, button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #0ea5e9; }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #1e293b;
    }

    .ok { color: #22c55e; font-weight: bold; }
    .err { color: #ef4444; font-weight: bold; }
    .warn { opacity: 0.85; font-size: 0.9em; }
  </style>
</head>

<body>

<h1>👤✅ AiDi – Verificación de Identidad Digital</h1>

<div class="card">
  <label>📎 Adjuntar imagen:</label>
  <input type="file" id="imageFile" accept="image/*" onchange="loadFile()" />

  <label>🔗 O URL pública:</label>
  <input type="text" id="imageUrl" placeholder="https://..." onblur="loadUrl()" />

  <div class="warn">La imagen debe contener un solo rostro</div>

  <img id="preview" style="display:none;" />

  <button onclick="recognize()">Reconocer rostro</button>
</div>

<div id="result" class="card" style="display:none;"></div>

<script>
const GALLERY_NAME = "acciones.in";
let imagePayload = "";
let previewImage = "";

function loadFile() {
  const file = document.getElementById("imageFile").files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    imagePayload = reader.result.split(",")[1];
    previewImage = reader.result;
    showPreview(previewImage);
  };
  reader.readAsDataURL(file);
}

function loadUrl() {
  const url = document.getElementById("imageUrl").value.trim();
  if (!url) return;
  imagePayload = url;
  previewImage = url;
  showPreview(url);
}

function showPreview(src) {
  const img = document.getElementById("preview");
  img.src = src;
  img.style.display = "block";
}

async function recognize() {
  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = "⏳ Reconociendo rostro...";

  if (!imagePayload) {
    result.innerHTML = "⚠️ Debes subir una imagen o ingresar una URL.";
    return;
  }

  const res = await fetch("https://kairos.clubempx.workers.dev/recognize", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      image: imagePayload,
      gallery_name: GALLERY_NAME
    })
  });

  const data = await res.json();

  if (
    !data.images ||
    !data.images[0].candidates ||
    data.images[0].candidates.length === 0
  ) {
    result.innerHTML = `
      <div class="err">❌ Rostro no reconocido</div>
      <p>Este rostro no existe en la galería <strong>${GALLERY_NAME}</strong></p>
      <a href="enroll.html">👉 Registrar este rostro</a>
    `;
    return;
  }

  const best = data.images[0].candidates[0];
  const confidence = (best.confidence * 100).toFixed(2);

  if (confidence < 80) {
    result.innerHTML = `
      <div class="err">⚠️ Coincidencia insuficiente</div>
      <p>Confianza: ${confidence} %</p>
    `;
    return;
  }

  result.innerHTML = `
    <div class="ok">✅ Rostro reconocido</div>
    <img src="${previewImage}" />
    <p><strong>ID:</strong> ${best.subject_id}</p>
    <p><strong>Confianza:</strong> ${confidence} %</p>
    <p><strong>Galería:</strong> ${GALLERY_NAME}</p>
  `;
}
</script>

</body>
</html>
